id = "demo-module"
name = "Demo Module"
version = "1.0.0"
description = "Example module demonstrating the Ridge module system"
platforms = ["linux", "macos"]

# Startup hooks run when the module is loaded
[[startup]]
command = ["echo", "demo-module: started"]

# Actions can be invoked with :module run <action-id>
[[actions]]
id = "say-hello"
name = "Say Hello"
description = "Prints a greeting"
command = ["echo", "Hello from demo-module!"]

[[actions]]
id = "show-panes"
name = "Show Panes"
description = "Lists active panes"
command = ["sh", "-c", "echo 'Active panes: $RIDGE_JSON' | python3 -c 'import sys,json;d=json.load(sys.stdin);[print(f\"  {p}\") for p in range(d.get(\"panes\",0))]'"]

# Event hooks fire on app events
[[events]]
event = "pane_spawn"
command = ["echo", "demo-module: pane spawned"]

[[events]]
event = "agent_blocked"
command = ["echo", "demo-module: agent blocked!"]

# Sidebar docks
[[docks]]
id = "demo-dock"
title = "Demo Info"
command = ["sh", "-c", "echo 'Demo module active'"]

# Bar widgets (compact single-row status)
[[bars]]
id = "demo-bar"
label = "demo"
command = ["sh", "-c", "echo 'demo:ok'"]

# Settings
[[settings]]
id = "demo-enabled"
name = "Demo Enabled"
description = "Enable demo module features"
type = "bool"
default = true

[[settings]]
id = "demo-greeting"
name = "Greeting"
description = "Custom greeting text"
type = "string"
default = "Hello from Demo Module!"

# Worktree provider - modules can provide custom worktree creation
[[worktree_provider]]
command = ["sh", "-c", "cat | python3 -c 'import sys,json;req=json.load(sys.stdin);print(json.dumps({\"ok\":True,\"path\":req[\"path\"]})')"]
platforms = ["linux", "macos"]
