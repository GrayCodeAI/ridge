name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../term-${{ matrix.target }}.tar.gz term
          cd ../../..
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../term-${{ matrix.target }}.zip term.exe
          cd ../../..
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: term-${{ matrix.target }}
          path: term-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: term-*
          generate_release_notes: true


  update-homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    if: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: GrayCodeAI/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Compute SHA256
        id: sha
        run: |
          SHA=$(curl -sL https://github.com/GrayCodeAI/term/archive/refs/tags/${{ github.ref_name }}.tar.gz | sha256sum | awk '{print $1}')
          echo "sha=$SHA" >> $GITHUB_OUTPUT
      - name: Update formula
        run: |
          cd tap
          sed -i 's/sha256 ".*"/sha256 "${{ steps.sha.outputs.sha }}"/' Formula/term.rb
          sed -i 's#url ".*"#url "https://github.com/GrayCodeAI/term/archive/refs/tags/${{ github.ref_name }}.tar.gz"#' Formula/term.rb
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Formula/term.rb
          git commit -m "chore: update term to ${{ github.ref_name }}" || echo "no changes"
          git push
