name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../term-${{ matrix.target }}.tar.gz term
          cd ../../..
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../term-${{ matrix.target }}.zip term.exe
          cd ../../..
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: term-${{ matrix.target }}
          path: term-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: term-*
          generate_release_notes: true

  # Updates the Homebrew tap formula after a release. Runs only when the
  # HOMEBREW_TAP_TOKEN secret is configured (mapped to env for the `if`).
  update-tap:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Has token?
        id: guard
        if: env.TAP_TOKEN != ''
        run: echo "present=1" >> "$GITHUB_OUTPUT"
      - if: steps.guard.outputs.present == '1'
        uses: actions/checkout@v4
        with:
          repository: GrayCodeAI/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - if: steps.guard.outputs.present == '1'
        name: Update formula
        run: |
          SHA=$(curl -fsSL "https://github.com/GrayCodeAI/term/archive/refs/tags/${TAG_NAME}.tar.gz" | sha256sum | awk '{print $1}')
          cd tap
          sed -i "s#url \".*\"#url \"https://github.com/GrayCodeAI/term/archive/refs/tags/${TAG_NAME}.tar.gz\"#" Formula/term.rb
          sed -i "s/sha256 \".*\"/sha256 \"${SHA}\"/" Formula/term.rb
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -am "chore: update term to ${TAG_NAME}" || echo "no changes"
          git push
